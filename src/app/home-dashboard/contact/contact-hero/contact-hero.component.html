<section class="hero">
  <div class="hero__inner">

    <!-- Left column -->
    <div class="hero__content">

      <p class="badge">
        <svg class="badge__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 20v-8" />
          <path d="M12 12C12 8.7 9.3 6 6 6c0 3.3 2.7 6 6 6Z" />
          <path d="M12 12.5c0-2.5 2-4.5 4.5-4.5 0 2.5-2 4.5-4.5 4.5Z" />
          <path d="M8.5 20h7" />
        </svg>
        <span>Contact Bigbisort</span>
      </p>

      <h1 class="hero__title">Let's grow <span class="hero__title-accent">together.</span></h1>

      <p class="hero__subtitle">
        Your gateway to global agri-trade — from Indian farms to buyers worldwide.
      </p>

      <p class="hero__body">
        Whether you're a farmer, buyer or partner, our team is here to help you trade with confidence.
      </p>

      <div class="hero__actions">
        <button type="button" class="btn btn--primary" (click)="sendEnquiry.emit()">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2.5" />
            <path d="m3.5 7.5 8.5 5.8 8.5-5.8" />
          </svg>
          <span>Send Enquiry</span>
        </button>

        <button type="button" class="btn btn--secondary" (click)="sendMessage.emit()">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 11.6a8.4 8.4 0 0 1-9 8.4 9.2 9.2 0 0 1-3.9-.9L3.4 20.6l1.5-4.3A8.3 8.3 0 0 1 3.8 11.6 8.5 8.5 0 0 1 12.4 3.2 8.5 8.5 0 0 1 21 11.6Z" />
          </svg>
          <span>Send us a Message</span>
        </button>

        <!-- Not wired up yet — the page has always shown this as "coming soon". -->
        <button type="button" class="btn btn--tertiary" disabled title="Coming soon">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="4" y="8" width="16" height="12" rx="3.5" />
            <path d="M12 8V5.5" />
            <circle cx="12" cy="4" r="1.3" />
            <path d="M9.3 13.2h.01M14.7 13.2h.01" />
            <path d="M10 16.8h4" />
          </svg>
          <span>Talk to Bigbisort AI</span>
        </button>
      </div>

      <ul class="audience">
        <li class="audience__item" *ngFor="let item of audience">
          <span class="audience__title">{{ item.title }}</span>
          <span class="audience__text">{{ item.description }}</span>
        </li>
      </ul>
    </div>

    <!-- Right column -->
    <div class="hero__media">
      <img
        src="assets/images/ContactUs/Glob3.png"
        alt="Illustrated globe with India highlighted and chat and mail bubbles around it"
        width="580"
        height="580"
        loading="eager"
        decoding="async" />
    </div>

  </div>
</section>

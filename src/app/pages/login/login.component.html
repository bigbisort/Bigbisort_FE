<div class="login-wrapper">
  <div class="login-box">
    <h2>Login to Bigbisort</h2>

    <!-- Radio buttons -->
    <div class="login-type">
      <label>
        <input type="radio" name="loginType" value="buyer" [(ngModel)]="loginType" />
        Buyer
      </label>
      <label>
        <input type="radio" name="loginType" value="seller" [(ngModel)]="loginType" />
        Seller
      </label>

    </div>

    <!-- Form inputs -->
    <div class="login-form" *ngIf="!isRegisterVisible">
      <!-- Buyer -->
      <div *ngIf="loginType === 'buyer'">
        <input [(ngModel)]="username" placeholder="Username" />
        <input [(ngModel)]="password" type="password" placeholder="Password" />
      </div>

      <!-- Seller -->
      <!-- <div *ngIf="loginType === 'seller'">
        <input [(ngModel)]="phone" placeholder="Phone Number" />z
        <input [(ngModel)]="otp" placeholder="6-digit OTP" maxlength="6" />
      </div> -->


         <div *ngIf="loginType === 'seller'">
        <input [(ngModel)]="username" placeholder="seller Uname" />
        <input [(ngModel)]="password" type="password" placeholder="Password" />
      </div>

      <!-- Admin -->
      <div *ngIf="loginType === 'admin'">
        <input [(ngModel)]="adminUsername" placeholder="Admin Username" />
        <input [(ngModel)]="adminPassword" type="password" placeholder="Admin Password" />
      </div>

      <button (click)="login()">Login</button>

      <!-- Links -->
      <div class="login-links">
        <a href="#" (click)="showRegister($event)">Register</a>
 |
        <!-- <a href="#" (click)="forgotPassword()">Forgot Password?</a> -->
      </div>
    </div>

   <!-- Register form -->
<div *ngIf="isRegisterVisible" class="register-box">
  <h2>Register</h2>
      <div class="register-form">
  <!-- Row 1: Name + Username -->
  <div class="form-row">
    <div class="form-group">
      <input [(ngModel)]="registerData.name" placeholder="Full Name" />
      <div *ngIf="registerErrors.name" class="error-msg">{{registerErrors.name}}</div>
    </div>
    <div class="form-group">
      <input [(ngModel)]="registerData.userName" placeholder="Username" />
      <div *ngIf="registerErrors.userName" class="error-msg">{{registerErrors.userName}}</div>
    </div>
  </div>

  <!-- Row 2: Email + Phone -->
  <div class="form-row">
    <div class="form-group">
      <input [(ngModel)]="registerData.email" placeholder="Email" />
      <div *ngIf="registerErrors.email" class="error-msg">{{registerErrors.email}}</div>
    </div>
    <div class="form-group">
      <input [(ngModel)]="registerData.phone" placeholder="Phone" />
      <div *ngIf="registerErrors.phone" class="error-msg">{{registerErrors.phone}}</div>
    </div>
  </div>

  <!-- Row 3: Address + Zip -->
  <div class="form-row">
    <div class="form-group">
      <input [(ngModel)]="registerData.address" placeholder="Address" />
      <div *ngIf="registerErrors.address" class="error-msg">{{registerErrors.address}}</div>
    </div>
    <div class="form-group">
      <input [(ngModel)]="registerData.zip" placeholder="Zip" />
      <div *ngIf="registerErrors.zip" class="error-msg">{{registerErrors.zip}}</div>
    </div>
  </div>

  <!-- Row 4: City + State + Country (3 in one line) -->
  <div class="form-row">
    <div class="form-group small">
      <input [(ngModel)]="registerData.city" placeholder="City" />
      <div *ngIf="registerErrors.city" class="error-msg">{{registerErrors.city}}</div>
    </div>
    <div class="form-group small">
      <input [(ngModel)]="registerData.state" placeholder="State" />
      <div *ngIf="registerErrors.state" class="error-msg">{{registerErrors.state}}</div>
    </div>
    <div class="form-group small">
      <input [(ngModel)]="registerData.country" placeholder="Country" />
      <div *ngIf="registerErrors.country" class="error-msg">{{registerErrors.country}}</div>
    </div>
  </div>

  <!-- Row 5: Password -->
  <div class="form-row">
    <div class="form-group full-width">
      <input [(ngModel)]="registerData.password" type="password" placeholder="Password" />
      <div *ngIf="registerErrors.password" class="error-msg">{{registerErrors.password}}</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="register-buttons">
    <button (click)="register()">Register</button>
    <button (click)="cancelRegister()" class="cancel-btn">Cancel</button>
  </div>
</div>

</div>


  </div>
</div>

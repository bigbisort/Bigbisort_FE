<div class="orders-container">
  <div class="page-header">
    <h2 class="page-title">Orders</h2>
  </div>

  <div class="orders-content">

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="search-wrap">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Filter by product name..." [(ngModel)]="productNameFilter" (ngModelChange)="onFilterChange()" />
      </div>

      <div class="search-wrap">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Filter by buyer name..." [(ngModel)]="buyerNameFilter" (ngModelChange)="onFilterChange()" />
      </div>

      <div class="status-wrap">
        <select [(ngModel)]="selectedStatus" (ngModelChange)="onFilterChange()">
          <option *ngFor="let s of statusOptions" [value]="s.value">{{s.label}}</option>
        </select>
      </div>

      <button class="btn-clear" (click)="clearFilters()">Clear</button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table *ngIf="!loading && orders.length > 0">
        <thead>
          <tr>
            <th>PRODUCT NAME</th>
            <th>BUYER NAME</th>
            <th>QUANTITY</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>
              <div class="product-info">
                <span class="p-name">{{order.productName}}</span>
              </div>
            </td>
            <td>{{order.buyerName}}</td>
            <td>{{order.quantity}}</td>
            <td>
              <span class="status-badge" [ngClass]="statusClass(order.status)">{{statusLabel(order.status)}}</span>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Loading state -->
      <div class="empty-state" *ngIf="loading">
        <div>Loading orders...</div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="!loading && orders.length === 0">
        <div class="alert alert-success d-flex align-items-center" role="alert" style="background-color: #e8f5e9; border: 1px solid #c8e6c9; color: #1b5e20;">
          <i class="bi bi-info-circle me-2"></i>
          <div>No orders available.</div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination-footer" *ngIf="!loading && orders.length > 0">
      <span class="page-info">Page {{currentPage + 1}} of {{totalPages}}</span>
      <div class="page-controls">
        <button [disabled]="currentPage === 0" (click)="prevPage()">&lsaquo;</button>
        <button [disabled]="currentPage >= totalPages - 1" (click)="nextPage()">&rsaquo;</button>
      </div>
    </div>

  </div>
</div>

<div class="seller-layout-container">
  <!-- Top Header -->
  <header class="seller-header">
    <div class="header-left">
      <div class="logo-area">
        <div class="logo-box">B</div>
        <span class="brand-name">Biggisort</span>
      </div>
      <span class="current-page">Dashboard</span>
    </div>

    <div class="header-right">
      <i class="bi bi-bell-fill mx-3 text-warning"></i>
      <span class="user-greeting">Hello, {{ sellerName }}!</span>
      <div class="user-menu-wrapper">
        <div class="user-avatar" (click)="toggleUserMenu()">
          <i class="bi bi-person-fill"></i>
        </div>
        <div class="user-dropdown" *ngIf="showUserMenu">
          <button class="logout-option" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="seller-body">
    <!-- Sidebar -->
    <aside class="seller-sidebar">
      <nav>
        <a routerLink="/seller/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
          <i class="bi bi-bar-chart-fill"></i> Dashboard
        </a>
        <a routerLink="/seller/products" routerLinkActive="active-link">
          <i class="bi bi-box-seam"></i> Products
        </a>
        <a routerLink="/seller/orders" routerLinkActive="active-link">
          <i class="bi bi-clipboard-data"></i> Orders
        </a>
        <a routerLink="/seller/payments" routerLinkActive="active-link">
          <i class="bi bi-currency-dollar"></i> Payments
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="seller-main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

name: Deploy frontend

on:
  push:
    branches: [ai_changes]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: bigbisortfe
  ROLE_ARN: arn:aws:iam::035242334777:role/bigbisort-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (production config -> https://api.bigbisort.com)
        run: npx ng build --configuration production

      - name: Check the bundle does not point at localhost
        run: |
          test -f dist/index.html
          if grep -rl "localhost:8081" dist; then echo "localhost API URL found in build" >&2; exit 1; fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete \
            --exclude "index.html" --exclude "deploy.tgz" --exclude "deploy-version.txt" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"

      - name: Publish package for the web server to pull
        run: |
          tar czf deploy.tgz -C dist .
          aws s3 cp deploy.tgz "s3://$S3_BUCKET/deploy.tgz" --cache-control no-store
          echo "${GITHUB_SHA}" > deploy-version.txt
          aws s3 cp deploy-version.txt "s3://$S3_BUCKET/deploy-version.txt" --cache-control no-store --content-type text/plain
